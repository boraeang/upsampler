[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private_assets_frequency"
version = "0.1.0.dev0"
description = "Production-grade temporal-disaggregation library for private/alternative asset returns: desmoothing, factor decomposition, Chow-Lin disaggregation, daily extension."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Quant Research" },
]
keywords = [
    "private equity",
    "hedge funds",
    "private credit",
    "infrastructure",
    "real estate",
    "desmoothing",
    "Geltner",
    "Getmansky-Lo-Makarov",
    "Chow-Lin",
    "temporal disaggregation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
calendar = [
    "pandas_market_calendars>=4.0",
]
all = [
    "matplotlib>=3.7",
    "pandas_market_calendars>=4.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.4",
    "matplotlib>=3.7",
    "pandas_market_calendars>=4.0",
]

[project.urls]
Documentation = "https://github.com/example/private_assets_frequency"
Source = "https://github.com/example/private_assets_frequency"

[tool.setuptools.packages.find]
include = ["private_assets_frequency*"]
exclude = ["docs*", "tests*"]

[tool.setuptools.package-data]
private_assets_frequency = ["py.typed"]

# ──────────────────────────────────────────────────────────────────
# Tooling
# ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["private_assets_frequency/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # statsmodels and scipy emit benign deprecation noise; relax as needed
    "ignore::DeprecationWarning:statsmodels.*",
    "ignore::PendingDeprecationWarning:statsmodels.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "synthetic: round-trip tests on synthetic ground-truth data",
    "sanity: sanity-anchor checks vs. public proxies",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "NPY", # numpy-specific rules
]
ignore = [
    "E501", # line length handled by formatter
    "N803", # allow math-style arg names (e.g. β passed as `B`)
    "N806", # allow math-style local names (e.g. `Lambda`, `Theta`)
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "pandas_market_calendars.*",
    "scipy.*",
]
ignore_missing_imports = true
